name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests, SQL static checks, dashboard smoke test
        run: pytest -q
      - name: Full pipeline — fixture, analysis, memo
        run: pytest -q -m slow
      - name: Memo must contain no unfilled template tokens
        run: |
          ! grep -q '{{' docs/MEMO.md
