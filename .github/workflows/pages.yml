# Publish web/ to GitHub Pages.
#
# The site is static by construction — no build step, no npm — so this uploads the
# directory as-is. It runs only after CI passes on main, because the gates in
# scripts/analyze.py are what make the numbers in web/data.js quotable; publishing a
# site built from a funnel that failed validation would defeat the entire pipeline.

name: Deploy site

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
